name: Build IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || true
      - name: Build unsigned IPA
        run: ./scripts/build_ipa.sh --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: AIAgentHub-unsigned-ipa
          path: build/*.ipa
